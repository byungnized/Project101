<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lotto Number Generator</h1>
            <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        </div>
        <lotto-display></lotto-display>
        <button id="generate-btn">Generate Numbers</button>
        <form class="partner-form" action="https://formspree.io/f/xpqjyyll" method="POST">
            <h2>Partnership Inquiry</h2>
            <label>
                Name
                <input type="text" name="name" required>
            </label>
            <label>
                Email
                <input type="email" name="email" required>
            </label>
            <label>
                Message
                <textarea name="message" rows="4" required></textarea>
            </label>
            <button type="submit" class="submit-btn">Send</button>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
